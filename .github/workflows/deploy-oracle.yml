name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy on Oracle VM
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load deployment config
        id: config
        run: |
          config=$(cat configs/investtrack-prod.json)
          echo "oracle_host=$(echo $config | jq -r '.oracle.host')" >> $GITHUB_OUTPUT
          echo "oracle_user=$(echo $config | jq -r '.oracle.user')" >> $GITHUB_OUTPUT
          echo "oracle_port=$(echo $config | jq -r '.oracle.port')" >> $GITHUB_OUTPUT
          echo "oracle_deploy_dir=$(echo $config | jq -r '.oracle.deployDir')" >> $GITHUB_OUTPUT

      - name: Create source archive
        run: |
          tar -czf source.tar.gz \
            --ignore-failed-read \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=.venv \
            --exclude=deployment-oracle-auth-sequencing-plan.md \
            --exclude=InvestmentTracker.code-workspace \
            --exclude=.git/** \
            --exclude=**/.git \
            .
          ls -lh source.tar.gz

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" > ~/.ssh/oracle-key
          chmod 600 ~/.ssh/oracle-key
          ssh-keyscan -p ${{ steps.config.outputs.oracle_port }} ${{ steps.config.outputs.oracle_host }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload source and deployment script
        run: |
          scp -P ${{ steps.config.outputs.oracle_port }} \
            -i ~/.ssh/oracle-key \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            source.tar.gz \
            scripts/deploy-remote.sh \
            ${{ steps.config.outputs.oracle_user }}@${{ steps.config.outputs.oracle_host }}:${{ steps.config.outputs.oracle_deploy_dir }}/

      - name: Execute remote deployment
        run: |
          ssh -p ${{ steps.config.outputs.oracle_port }} \
            -i ~/.ssh/oracle-key \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            ${{ steps.config.outputs.oracle_user }}@${{ steps.config.outputs.oracle_host }} \
            "chmod +x ${{ steps.config.outputs.oracle_deploy_dir }}/deploy-remote.sh && \
             ORACLE_HOST=${{ steps.config.outputs.oracle_host }} \
             ORACLE_USER=${{ steps.config.outputs.oracle_user }} \
             ORACLE_PORT=${{ steps.config.outputs.oracle_port }} \
             DEPLOY_DIR=${{ steps.config.outputs.oracle_deploy_dir }} \
             GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
             ALLOWED_EMAILS=${{ secrets.ALLOWED_EMAILS }} \
             ENABLE_SCHEDULER=true \
             ALLOW_DB_MIGRATIONS=false \
             GIT_SHA=${{ github.sha }} \
             ${{ steps.config.outputs.oracle_deploy_dir }}/deploy-remote.sh"

      - name: Verify deployment
        run: |
          sleep 5
          curl -sf -m 30 https://investtrack.duckdns.org/health || \
            curl -sf -m 30 http://${{ steps.config.outputs.oracle_host }}:8080/health || \
            echo "Warning: Could not verify health check endpoint immediately, but deployment script completed"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/oracle-key
