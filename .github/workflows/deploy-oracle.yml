name: Deploy Oracle Production

on:
  workflow_dispatch:
    inputs:
      allow_db_migrations:
        description: Allow DB migrations during startup (set true for schema changes only)
        required: false
        default: false
        type: boolean
      backup_before_deploy:
        description: Run backup script on VM before deploy
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load deployment config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          # Parse investtrack.config.json for deployment defaults
          CONFIG_FILE="configs/investtrack.config.json"
          test -f "${CONFIG_FILE}" || { echo "Config file not found: ${CONFIG_FILE}"; exit 1; }
          
          ORACLE_HOST=$(jq -r '.oracle.host' "${CONFIG_FILE}")
          ORACLE_USER=$(jq -r '.oracle.user' "${CONFIG_FILE}")
          ORACLE_PORT=$(jq -r '.oracle.port' "${CONFIG_FILE}")
          ORACLE_DEPLOY_DIR=$(jq -r '.oracle.deployDir' "${CONFIG_FILE}")
          ORACLE_ENV_FILE=$(jq -r '.oracle.envFile' "${CONFIG_FILE}")
          ORACLE_DATA_DIR=$(jq -r '.oracle.dataDir' "${CONFIG_FILE}")
          ORACLE_BACKUP_SCRIPT=$(jq -r '.oracle.backupScript' "${CONFIG_FILE}")
          
          echo "oracle_host=${ORACLE_HOST}" >> "$GITHUB_OUTPUT"
          echo "oracle_user=${ORACLE_USER}" >> "$GITHUB_OUTPUT"
          echo "oracle_port=${ORACLE_PORT}" >> "$GITHUB_OUTPUT"
          echo "oracle_deploy_dir=${ORACLE_DEPLOY_DIR}" >> "$GITHUB_OUTPUT"
          echo "oracle_env_file=${ORACLE_ENV_FILE}" >> "$GITHUB_OUTPUT"
          echo "oracle_data_dir=${ORACLE_DATA_DIR}" >> "$GITHUB_OUTPUT"
          echo "oracle_backup_script=${ORACLE_BACKUP_SCRIPT}" >> "$GITHUB_OUTPUT"
          
          echo "Loaded deployment config from ${CONFIG_FILE}"

      - name: Validate required secrets and config
        shell: bash
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID_SECRET: ${{ secrets.GOOGLE_CLIENT_ID }}
          ALLOWED_EMAILS_SECRET: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          set -euo pipefail
          test -n "${{ steps.config.outputs.oracle_host }}" || { echo "Missing oracle.host in investtrack.config.json"; exit 1; }
          test -n "${{ steps.config.outputs.oracle_user }}" || { echo "Missing oracle.user in investtrack.config.json"; exit 1; }
          test -n "${ORACLE_SSH_PRIVATE_KEY}" || { echo "Missing secret ORACLE_SSH_PRIVATE_KEY"; exit 1; }
          test -n "${GOOGLE_CLIENT_ID_SECRET}" || { echo "Missing secret GOOGLE_CLIENT_ID"; exit 1; }
          test -n "${ALLOWED_EMAILS_SECRET}" || { echo "Missing secret ALLOWED_EMAILS"; exit 1; }
          echo "Config validation passed"

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.venv \
            --exclude=__pycache__ \
            -czf /tmp/investment-tracker-src.tar.gz .

      - name: Copy source archive to Oracle VM
        shell: bash
        run: |
          set -euo pipefail
          PORT="${{ steps.config.outputs.oracle_port }}"
          scp \
            -P "${PORT}" \
            -o StrictHostKeyChecking=accept-new \
            /tmp/investment-tracker-src.tar.gz \
            "${{ steps.config.outputs.oracle_user }}@${{ steps.config.outputs.oracle_host }}:/tmp/investment-tracker-src.tar.gz"

      - name: Deploy on Oracle VM
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          ENABLE_SCHEDULER: true
          ALLOW_DB_MIGRATIONS: ${{ inputs.allow_db_migrations }}
          BACKUP_BEFORE_DEPLOY: ${{ inputs.backup_before_deploy }}
          ORACLE_HOST: ${{ steps.config.outputs.oracle_host }}
          ORACLE_USER: ${{ steps.config.outputs.oracle_user }}
          ORACLE_PORT: ${{ steps.config.outputs.oracle_port }}
          ORACLE_DEPLOY_DIR: ${{ steps.config.outputs.oracle_deploy_dir }}
          ORACLE_ENV_FILE: ${{ steps.config.outputs.oracle_env_file }}
          ORACLE_DATA_DIR: ${{ steps.config.outputs.oracle_data_dir }}
          ORACLE_BACKUP_SCRIPT: ${{ steps.config.outputs.oracle_backup_script }}
        run: |
          set -euo pipefail

          ssh -p "${ORACLE_PORT}" -o StrictHostKeyChecking=accept-new "${ORACLE_USER}@${ORACLE_HOST}" \
            "GOOGLE_CLIENT_ID='${GOOGLE_CLIENT_ID}' ALLOWED_EMAILS='${ALLOWED_EMAILS}' ENABLE_SCHEDULER='${ENABLE_SCHEDULER}' ALLOW_DB_MIGRATIONS='${ALLOW_DB_MIGRATIONS}' BACKUP_BEFORE_DEPLOY='${BACKUP_BEFORE_DEPLOY}' ORACLE_DEPLOY_DIR='${ORACLE_DEPLOY_DIR}' ORACLE_ENV_FILE='${ORACLE_ENV_FILE}' ORACLE_DATA_DIR='${ORACLE_DATA_DIR}' ORACLE_BACKUP_SCRIPT='${ORACLE_BACKUP_SCRIPT}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          if [ "${BACKUP_BEFORE_DEPLOY}" = "true" ] && [ -x "${ORACLE_BACKUP_SCRIPT}" ]; then
            set +e
            sudo "${ORACLE_BACKUP_SCRIPT}"
            backup_exit=$?
            set -e

            if [ "${backup_exit}" -ne 0 ]; then
              echo "Backup script exited with code ${backup_exit}. Checking for fresh backup artifact..."
              if sudo find "${ORACLE_DATA_DIR}/backups" -maxdepth 1 -type f -name 'data-*.tar.gz' -mmin -20 | grep -q .; then
                echo "Fresh backup artifact found under ${ORACLE_DATA_DIR}/backups. Continuing deployment."
              else
                echo "Backup failed and no fresh backup artifact found. Aborting deployment."
                exit 1
              fi
            fi
          fi

          rm -rf "${ORACLE_DEPLOY_DIR}"
          mkdir -p "${ORACLE_DEPLOY_DIR}"
          tar -xzf /tmp/investment-tracker-src.tar.gz -C "${ORACLE_DEPLOY_DIR}"
          cd "${ORACLE_DEPLOY_DIR}"

          sudo docker build -t investment-tracker:latest .

          sudo touch "${ORACLE_ENV_FILE}"
          sudo sed -i '/^GOOGLE_CLIENT_ID=/d;/^ALLOWED_EMAILS=/d;/^AUTH_DISABLED=/d;/^ENABLE_SCHEDULER=/d;/^ALLOW_DB_MIGRATIONS=/d' "${ORACLE_ENV_FILE}"
          {
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            echo "ALLOWED_EMAILS=${ALLOWED_EMAILS}"
            echo "AUTH_DISABLED=false"
            echo "ENABLE_SCHEDULER=${ENABLE_SCHEDULER}"
            echo "ALLOW_DB_MIGRATIONS=${ALLOW_DB_MIGRATIONS}"
          } | sudo tee -a "${ORACLE_ENV_FILE}" >/dev/null

          if sudo docker ps -a --format '{{.Names}}' | grep -q '^investment-tracker$'; then
            sudo docker stop investment-tracker >/dev/null || true
            sudo docker rm investment-tracker >/dev/null || true
          fi

          sudo docker run -d \
            --name investment-tracker \
            --restart unless-stopped \
            -p 8080:8080 \
            -v "${ORACLE_DATA_DIR}:/data" \
            --env-file "${ORACLE_ENV_FILE}" \
            investment-tracker:latest >/dev/null

          sleep 3
          curl -fsS http://127.0.0.1:8080/api/auth/config >/dev/null
          echo "Deploy verification completed."
          REMOTE_SCRIPT

      - name: Cleanup runner artifact
        if: always()
        shell: bash
        run: rm -f /tmp/investment-tracker-src.tar.gz
